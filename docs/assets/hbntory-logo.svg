<svg width="560" height="160" viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4338CA" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon tile -->
  <g filter="url(#soft)">
    <rect x="20" y="20" width="120" height="120" rx="30" fill="url(#tile)"/>
  </g>

  <!-- AI node + beam -->
  <line x1="80" y1="41" x2="80" y2="63" stroke="url(#node)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="80" cy="39" r="7.5" fill="url(#node)" filter="url(#glow)"/>

  <!-- Isometric box (package) -->
  <!-- left face -->
  <polygon points="46,62 80,79 80,111 46,94" fill="#C7D2FE"/>
  <!-- right face -->
  <polygon points="114,62 80,79 80,111 114,94" fill="#A5B4FC"/>
  <!-- top face -->
  <polygon points="80,45 114,62 80,79 46,62" fill="#FFFFFF"/>
  <!-- seam on top -->
  <line x1="80" y1="45" x2="80" y2="79" stroke="#E0E7FF" stroke-width="2"/>

  <!-- Wordmark -->
  <text x="170" y="99" font-size="62" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#6366F1">HB</tspan><tspan fill="#1E293B">ntory</tspan>
  </text>
  <text x="172" y="123" font-size="13.5" font-weight="600" letter-spacing="4.5" fill="#64748B">INVENTORY · AI ASSISTANT</text>
</svg>
